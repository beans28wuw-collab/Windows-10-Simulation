<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Windows 10 Professional - Ultimate Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* --- STAGE 1: REALISTIC PC BOOT SCREEN --- */
        #pc-boot-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: monospace;
            padding: 20px;
            font-size: 14px;
            line-height: 1.6;
            z-index: 110000;
        }

        /* --- STAGE 2: WINDOWS 10 LOADING SCREEN --- */
        #win10-loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100000;
        }

        .win10-logo {
            width: 110px;
            height: 110px;
            color: #0078d7;
            margin-bottom: 80px;
        }

        /* Windows 10 Dot Ring Loading Animation */
        .dot-ring {
            position: relative;
            width: 50px;
            height: 50px;
        }

        .dot-ring .dot {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            animation: moveDot 3.5s infinite cubic-bezier(0.1, 0.6, 0.9, 0.4);
            transform-origin: 25px 25px;
        }

        .dot-ring .dot:nth-child(1) { animation-delay: 0s; }
        .dot-ring .dot:nth-child(2) { animation-delay: 0.15s; }
        .dot-ring .dot:nth-child(3) { animation-delay: 0.3s; }
        .dot-ring .dot:nth-child(4) { animation-delay: 0.45s; }
        .dot-ring .dot:nth-child(5) { animation-delay: 0.6s; }

        @keyframes moveDot {
            0% { transform: rotate(0deg); opacity: 0; }
            5% { opacity: 1; }
            70% { transform: rotate(720deg); opacity: 1; }
            75% { opacity: 0; transform: rotate(720deg); }
            100% { transform: rotate(720deg); opacity: 0; }
        }

        /* --- STAGE 3: WINDOWS 10 SIGN-IN LOCK SCREEN --- */
        #win10-lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.3)), url('https://unsplash.com') no-repeat center center;
            background-size: cover;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            padding: 50px;
            color: white;
            z-index: 90000;
            transition: transform 0.5s cubic-bezier(0.1, 0.8, 0.2, 1);
        }

        .lock-time-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .lock-time {
            font-size: 80px;
            font-weight: 100;
            line-height: 1;
        }

        .lock-date {
            font-size: 24px;
            font-weight: 300;
        }

        /* Sign in overlay container inside lockscreen state */
        #signin-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .user-avatar {
            width: 120px;
            height: 120px;
            background-color: rgba(255,255,255,0.2);
            border-radius: 50%;
            font-size: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .user-name {
            font-size: 28px;
            font-weight: 300;
            margin-bottom: 25px;
        }

        .signin-btn {
            background-color: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            padding: 8px 32px;
            font-size: 15px;
            cursor: pointer;
            outline: none;
        }

        .signin-btn:hover {
            background-color: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.6);
        }

        /* --- STAGE 4: MAIN DESKTOP ENVIRONMENT --- */
        #desktop-shell {
            width: 100%;
            height: 100%;
            position: relative;
            background: #0078d7 url('https://unsplash.com') no-repeat center center;
            background-size: cover;
            display: none;
        }

        /* Grid Icons Arrangement */
        .desktop-icons-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 40px);
            padding: 10px;
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(auto-fill, 75px);
            grid-template-columns: repeat(auto-fill, 75px);
            gap: 15px;
            align-content: flex-start;
            justify-content: flex-start;
            z-index: 5;
        }

        .sys-shortcut {
            width: 75px;
            height: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
            border-radius: 2px;
            padding: 4px;
            transition: background 0.1s;
        }

        .sys-shortcut:hover {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .shortcut-graphic {
            font-size: 26px;
            margin-bottom: 5px;
        }

        .shortcut-text {
            color: #fff;
            font-size: 11px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }

        /* --- THE ADVANCED WINDOWING ENGINE --- */
        .window-instance {
            position: absolute;
            width: 450px;
            height: 320px;
            background-color: #fff;
            border: 1px solid #0078d7;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            z-index: 50;
            border-radius: 2px;
            min-width: 250px;
            min-height: 150px;
        }

        @media (max-width: 600px) {
            .window-instance {
                width: 90% !important;
                height: 65% !important;
            }
        }

        .window-instance.maximized {
            width: 100% !important;
            height: calc(100% - 40px) !important;
            top: 0 !important;
            left: 0 !important;
        }

        .window-instance.minimized {
            display: none !important;
        }

        .window-header {
            height: 32px;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 12px;
            font-size: 12px;
            color: #222;
            border-bottom: 1px solid #eaeaea;
            cursor: move;
        }

        .window-identity {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .window-actions {
            display: flex;
            height: 100%;
        }

        .action-node-btn {
            width: 46px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            color: #000;
        }

        .action-node-btn:hover { background-color: #e5e5e5; }
        .action-node-btn.exit-node-btn:hover { background-color: #e81123; color: #fff; }

        .window-client-frame {
            flex: 1;
            overflow: hidden;
            background-color: #fff;
            color: #000;
        }

        /* --- APPLICATION RUNTIMES --- */
        .runtime-notepad-pane {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            padding: 10px;
            font-family: 'Consolas', Menlo, monospace;
            font-size: 13px;
            resize: none;
        }

        .runtime-cmd-pane {
            width: 100%;
            height: 100%;
            background-color: #0c0c0c;
            color: #cccccc;
            font-family: 'Consolas', monospace;
            padding: 12px;
            font-size: 12px;
            overflow-y: auto;
        }
        .cmd-output-history { margin-bottom: 4px; line-height: 1.4; white-space: pre-wrap; }
        .cmd-interactive-line { display: flex; align-items: center; width: 100%; }
        .cmd-shell-input {
