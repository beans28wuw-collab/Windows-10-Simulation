<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Windows 10 Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* --- DESKTOP CORES SHELL --- */
        #desktop-shell {
            width: 100%;
            height: 100%;
            position: relative;
            background: #0078d7 url('https://unsplash.com') no-repeat center center;
            background-size: cover;
        }

        /* Desktop Grid Icons Container Layout */
        .desktop-icons-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 40px);
            padding: 10px;
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(auto-fill, 75px);
            grid-template-columns: repeat(auto-fill, 75px);
            gap: 15px;
            align-content: flex-start;
            justify-content: flex-start;
            z-index: 5;
        }

        .sys-shortcut {
            width: 75px;
            height: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
            border-radius: 2px;
            padding: 4px;
            transition: background 0.1s;
        }

        .sys-shortcut:hover {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .shortcut-graphic {
            font-size: 26px;
            margin-bottom: 5px;
        }

        .shortcut-text {
            color: #fff;
            font-size: 11px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }

        /* --- THE ADVANCED WINDOWING ENGINE --- */
        .window-instance {
            position: absolute;
            width: 500px;
            height: 360px;
            background-color: #fff;
            border: 1px solid #707070;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            z-index: 50;
            border-radius: 2px;
            min-width: 300px;
            min-height: 200px;
        }

        @media (max-width: 600px) {
            .window-instance {
                width: 95% !important;
                height: 70% !important;
            }
        }

        .window-instance.maximized {
            width: 100% !important;
            height: calc(100% - 40px) !important;
            top: 0 !important;
            left: 0 !important;
        }

        .window-instance.minimized {
            display: none !important;
        }

        .window-header {
            height: 32px;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 12px;
            font-size: 12px;
            color: #222;
            border-bottom: 1px solid #eaeaea;
            cursor: move;
        }

        .window-identity {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .window-actions {
            display: flex;
            height: 100%;
        }

        .action-node-btn {
            width: 46px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            color: #000;
        }

        .action-node-btn:hover { background-color: #e5e5e5; }
        .action-node-btn.exit-node-btn:hover { background-color: #e81123; color: #fff; }

        .window-client-frame {
            flex: 1;
            overflow: hidden;
            background-color: #fff;
            color: #000;
        }

        /* --- APPLICATION RUNTIMES --- */
        /* Command Prompt */
        .runtime-cmd-pane {
            width: 100%;
            height: 100%;
            background-color: #0c0c0c;
            color: #cccccc;
            font-family: 'Consolas', monospace;
            padding: 12px;
            font-size: 12px;
            overflow-y: auto;
        }
        .cmd-output-history { margin-bottom: 4px; line-height: 1.4; white-space: pre-wrap; }
        .cmd-interactive-line { display: flex; align-items: center; width: 100%; }
        .cmd-shell-input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            flex: 1;
        }

        /* File Explorer */
        .runtime-explorer-pane {
            display: flex;
            height: 100%;
        }
        .explorer-tree-sidebar {
            width: 130px;
            background-color: #f0f0f0;
            border-right: 1px solid #dfdfdf;
            padding: 10px 5px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .sidebar-node-item { padding: 4px 6px; cursor: pointer; border-radius: 3px; }
        .sidebar-node-item:hover { background-color: #e0e0e0; }
        .explorer-grid-view {
            flex: 1;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 20px;
            align-content: flex-start;
        }
        .explorer-file-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            font-size: 11px;
            cursor: pointer;
        }

        /* Edge Browser Clone Layout */
        .runtime-browser-pane {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .browser-address-header {
            height: 36px;
            background-color: #f3f3f3;
            border-bottom: 1px solid #dfdfdf;
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 8px;
        }
        .browser-address-bar {
            flex: 1;
            height: 24px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 0 12px;
            font-size: 11px;
            display: flex;
            align-items: center;
            color: #555;
        }
        .browser-viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: #f9f9f9;
            padding: 20px;
            text-align: center;
        }

        /* Control Panel */
        .control-panel-grid {
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .cp-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border: 1px solid transparent;
            cursor: pointer;
        }
        .cp-item:hover { background-color: #f2f2f2; border-color: #e5e5e5; }

        /* Recycle Bin Empty view */
        .bin-empty-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #555;
            font-size: 13px;
        }

        /* --- PLATFORM TASKBAR SYSTEM --- */
        .os-taskbar-shelf {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background-color: rgba(16, 16, 16, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10000;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .taskbar-left-cluster, .taskbar-right-cluster, .active-apps-tray {
            display: flex;
            align-items: center;
            height: 100%;
        }
        .active-apps-tray { flex: 1; margin: 0 10px; overflow-x: auto; gap: 4px; }

        .taskbar-trigger-node {
            width: 48px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
        }
        .taskbar-trigger-node:hover { background-color: rgba(255, 255, 255, 0.1); }
        .taskbar-trigger-node.active-state-node {
            background-color: rgba(255, 255, 255, 0.15);
            color: #0078d7;
        }

        .search-box-mockup {
            width: 150px;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            padding: 0 12px;
            color: #ccc;
            font-size: 12px;
        }
        @media (max-width: 540px) { .search-box-mockup { display: none; } }

        .app-tray-tab {
            height: 100%;
            width: 110px;
