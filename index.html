
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 10 Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0078d7 url('https://unsplash.com') no-repeat center center;
            background-size: cover;
        }

        /* Desktop Area */
        .desktop {
            width: 100%;
            height: calc(100% - 40px);
            position: relative;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-content: flex-start;
            flex-wrap: wrap;
        }

        .icon {
            width: 75px;
            height: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
            border-radius: 2px;
            padding: 5px;
        }

        .icon:hover {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .icon-img {
            width: 35px;
            height: 35px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .icon-text {
            color: white;
            font-size: 11px;
            text-shadow: 1px 1px 2px black;
            word-break: break-word;
        }

        /* Taskbar */
        .taskbar {
            width: 100%;
            height: 40px;
            background: rgba(16, 16, 16, 0.85);
            backdrop-filter: blur(10px);
            position: absolute;
            bottom: 0;
            left: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 9999;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .taskbar-left {
            display: flex;
            height: 100%;
            align-items: center;
        }

        .start-btn {
            width: 48px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #0078d7;
            font-size: 18px;
            transition: background 0.1s;
        }

        .start-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #00a3ff;
        }

        .search-box {
            height: 100%;
            width: 150px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 0 10px;
            color: white;
            font-size: 12px;
            outline: none;
        }

        @media (max-width: 600px) {
            .search-box { display: none; }
        }

        .taskbar-right {
            display: flex;
            height: 100%;
            align-items: center;
            padding-right: 10px;
            gap: 12px;
        }

        .system-tray-item {
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .clock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 0 8px;
            color: white;
            font-size: 11px;
            text-align: right;
            cursor: pointer;
        }

        .clock-container:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Start Menu */
        .start-menu {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 320px;
            height: 450px;
            background: rgba(24, 24, 24, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: none;
            display: none;
            flex-direction: row;
            z-index: 9998;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .start-menu.active {
            display: flex;
        }

        .start-sidebar {
            width: 45px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 10px;
            gap: 20px;
            background: rgba(0, 0, 0, 0.2);
        }

        .sidebar-icon {
            color: white;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            padding: 10px 0;
        }

        .sidebar-icon:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .start-apps {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            color: white;
        }

        .app-item {
            padding: 8px 10px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <!-- Desktop Environment -->
    <div class="desktop" id="desktop">
        <div class="icon" onclick="alert('This PC is empty')">
            <div class="icon-img">💻</div>
            <div class="icon-text">This PC</div>
        </div>
        <div class="icon" onclick="alert('Recycle Bin is empty')">
            <div class="icon-img">🗑️</div>
            <div class="icon-text">Recycle Bin</div>
        </div>
        <div class="icon" onclick="window.open('https://google.com', '_blank')">
            <div class="icon-img">🌐</div>
            <div class="icon-text">Internet Browser</div>
        </div>
    </div>

    <!-- Start Menu -->
    <div class="start-menu" id="startMenu">
        <div class="start-sidebar">
            <div class="sidebar-icon">👤</div>
            <div class="sidebar-icon">⚙️</div>
            <div class="sidebar-icon" onclick="toggleStartMenu()">❌</div>
        </div>
        <div class="start-apps">
            <div class="app-item">Calculator</div>
            <div class="app-item">Notepad</div>
            <div class="app-item">Paint</div>
            <div class="app-item">Settings</div>
        </div>
    </div>

    <!-- Taskbar -->
    <div class="taskbar">
        <div class="taskbar-left">
            <div class="start-btn" onclick="toggleStartMenu()">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M0 2.217L6.545 1.33v6.336H0V2.217zm0 11.566l6.545.887V8.34H0v5.443zm7.255 1.012L16 16V8.34H7.255v6.455zM7.255 1.23v6.442H16V0L7.255 1.23z"/>
                </svg>
            </div>
            <input type="text" class="search-box" placeholder="Type here to search">
        </div>
        
        <div class="taskbar-right">
            <div class="system-tray-item">📶</div>
            <div class="system-tray-item">🔋</div>
            <div class="clock-container">
                <span id="time-display">12:00 PM</span>
                <span id="date-display">10/7/2026</span>
            </div>
        </div>
    </div>

    <script>
        // Toggle Start Menu
        function toggleStartMenu() {
            const menu = document.getElementById('startMenu');
            menu.classList.toggle('active');
        }

        // Close menu when clicking desktop
        document.getElementById('desktop').addEventListener('click', function(e) {
            if (e.target === this) {
                document.getElementById('startMenu').classList.remove('active');
            }
        });

        // Real-Time System Clock
        function updateClock() {
            const now = new Date();
            
            // Format Time
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0'+minutes : minutes;
            const timeStr = `${hours}:${minutes} ${ampm}`;
            
            // Format Date
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const year = now.getFullYear();
            const dateStr = `${month}/${day}/${year}`;

            document.getElementById('time-display').textContent = timeStr;
            document.getElementById('date-display').textContent = dateStr;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
