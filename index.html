<style>

<script>

$('#desk').append(e);w={id,e,bd:e.querySelector('.bd'),tt:e.querySelector('.tt'),max:false,snap:false,prev:null};wins[id]=w;

e.querySelector('.bm').onclick=()=>minimize(w);e.querySelector('.bc').onclick=()=>close(w);bx.onclick=()=>{hideFly();maxToggle(w)};tb.ondblclick=ev=>{if(!ev.target.closest('button'))maxToggle(w)};

a.r(w,arg);focus(w);closePops();return w}

paint:{n:'Paint',i:'🎨',w:620,h:440,r(w){const bd=w.bd;bd.innerHTML='<div class="bar" id="ptb"></div><div id="pwrap" style="flex:1;min-height:0;overflow:auto;background:#fff"><canvas style="display:block;touch-action:none;cursor:crosshair"></canvas></div>';const tb=bd.querySelector('#ptb'),c=bd.querySelector('canvas'),x=c.getContext('2d',{willReadFrequently:true}),wr=bd.querySelector('#pwrap');
let tool='pen',col='#000000',size=4,d=0,sx=0,sy=0,base,undo=[];
tb.innerHTML=[['pen','✏️'],['eraser','🧽'],['line','／'],['rect','▭'],['oval','◯'],['fill','🪣']].map(t=>`<button data-t="${t[0]}" title="${t[0]}">${t[1]}</button>`).join('')+'<input type="color" value="#000000" data-k="col"><input type="range" min="1" max="40" value="4" style="width:80px" data-k="sz"><button data-a="un">↶</button><button data-a="cl">Clear</button><button data-a="sv">Save</button>';

tb.onclick=e=>{const b=e.target,a=b.dataset.a;if(b.dataset.t){tool=b.dataset.t;mark()}else if(a==='un'){const q=undo.pop();if(q)x.putImageData(q,0,0)}else if(a==='cl'){snap();x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}else if(a==='sv'){fs.Pictures=fs.Pictures||{};const k=uniq(fs.Pictures,'Paint '+new Date().toLocaleDateString().replace(/[\/\\]/g,'-')+' '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}).replace(/:/g,'.')+'.png');fs.Pictures[k]=c.toDataURL('image/png');save();toast((ST.get('w11.fs','').includes(k)?'Saved to Pictures':'Saved for this session only (storage is full)'))}};
tb.oninput=e=>{if(e.target.dataset.k==='col')col=e.target.value;else if(e.target.dataset.k==='sz')size=+e.target.value};
const fit=()=>{const W=Math.max(c.width,wr.clientWidth,300),H=Math.max(c.height,wr.clientHeight,250);if(W===c.width&&H===c.height)return;const o=c.width?x.getImageData(0,0,c.width,c.height):null;c.width=W;c.height=H;x.fillStyle='#fff';x.fillRect(0,0,W,H);if(o)x.putImageData(o,0,0)};
new ResizeObserver(fit).observe(wr);fit();
const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]},st=()=>{x.lineCap=x.lineJoin='round';x.lineWidth=size;x.strokeStyle=x.fillStyle=tool==='eraser'?'#fff':col};
const flood=(px,py)=>{const W=c.width,H=c.height;if(px<0||py<0||px>=W||py>=H)return;const im=x.getImageData(0,0,W,H),u=new Uint32Array(im.data.buffer),t=document.createElement('canvas').getContext('2d');t.fillStyle=col;t.fillRect(0,0,1,1);const q=new Uint32Array(t.getImageData(0,0,1,1).data.buffer)[0],o=u[py*W+px];if(o===q)return;const s=[px+py*W];while(s.length){const i=s.pop(),cx=i%W,cy=(i-cx)/W;if(u[i]!==o)continue;let l=cx,r=cx;while(l>0&&u[cy*W+l-1]===o)l--;while(r<W-1&&u[cy*W+r+1]===o)r++;for(let k=l;k<=r;k++){u[cy*W+k]=q;if(cy>0&&u[(cy-1)*W+k]===o)s.push((cy-1)*W+k);if(cy<H-1&&u[(cy+1)*W+k]===o)s.push((cy+1)*W+k)}}x.putImageData(im,0,0)};
c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);[sx,sy]=pos(e);snap();if(tool==='fill'){flood(Math.round(sx),Math.round(sy));return}d=1;st();base=x.getImageData(0,0,c.width,c.height);x.beginPath();x.moveTo(sx,sy);x.lineTo(sx+.01,sy);x.stroke()};
c.onpointermove=e=>{if(!d)return;const[px,py]=pos(e);st();if(tool==='pen'||tool==='eraser'){x.lineTo(px,py);x.stroke();return}x.putImageData(base,0,0);x.beginPath();if(tool==='line'){x.moveTo(sx,sy);x.lineTo(px,py)}else if(tool==='rect')x.rect(sx,sy,px-sx,py-sy);else x.ellipse((sx+px)/2,(sy+py)/2,Math.abs(px-sx)/2,Math.abs(py-sy)/2,0,0,7);x.stroke()};

photos:{n:'Photos',i:'🖼️',w:640,h:440,r(w,arg){const bd=w.bd;let cur=arg&&arg.name||null;const imgs=()=>Object.keys(fs.Pictures||{}).filter(k=>/^data:image\//.test(fs.Pictures[k]));

taskmgr:{n:'Task Manager',i:'📊',w:480,h:400,r(w){const bd=w.bd,hist=Array(40).fill(8),tabs='<div class="bar"><button data-t="p">Processes</button><button data-t="f">Performance</button></div>';let tab='p',n=0;

clock:{n:'Clock',i:'⏰',w:380,h:380,r(w){const bd=w.bd;let t0=0,el=0,run=0,laps=[],tl=0,ti=0,mode='s';
const fmt=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+'.'+String(Math.floor(ms%1000/10)).padStart(2,'0')},cur=()=>el+(run?Date.now()-t0:0);

mines:{n:'Minesweeper',i:'💣',w:340,h:440,r(w){const bd=w.bd,R=9,MN=10,NC=['','#00f','#080','#f00','#008','#800','#088','#000','#555'];let g,over,first,t0,flag=0;

const reveal=i=>{const s=[i];while(s.length){const j=s.pop(),c=g[j];if(c.o||c.f)continue;c.o=1;if(c.m){over=-1;continue}if(!c.n)nb(j).forEach(k=>s.push(k))}};
