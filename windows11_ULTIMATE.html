<script>
(()=>{

(()=>{

 if(kind==='left'){ww=W/2}else if(kind==='right'){x=W/2;ww=W/2}else if(kind==='tl'){ww=W/2;hh=H/2}else if(kind==='tr'){x=W/2;ww=W/2;hh=H/2}else if(kind==='bl'){y=H/2;ww=W/2;hh=H/2}else if(kind==='br'){x=W/2;y=H/2;ww=W/2;hh=H/2}else if(kind==='max'){e.classList.add('max');return}

/* Keyboard shortcuts */
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;const k=e.key.toLowerCase(), win=e.metaKey||e.ctrlKey&&e.altKey;

$('#task')?.addEventListener('contextmenu',e=>{e.preventDefault();ctx.innerHTML='<div class="wctxi" data-q="center">▣ Center taskbar</div><div class="wctxi" data-q="left">▤ Left taskbar</div><div class="wctxi" data-q="lock">🔒 Lock</div><div class="wctxi" data-q="power">⏻ Power</div>';ctx.style.left=Math.min(innerWidth-225,e.clientX)+'px';ctx.style.top=Math.max(8,e.clientY-180)+'px';ctx.classList.add('on');ctx.onclick=ev=>{const q=ev.target.closest('[data-q]')?.dataset.q;if(!q)return;if(q==='left'){document.body.classList.add('l');$('#task').classList.add('l');try{ST.set('w11.al','l')}catch{}}if(q==='center'){document.body.classList.remove('l');$('#task').classList.remove('l');try{ST.set('w11.al','c')}catch{}}if(q==='lock')lock();if(q==='power')power.classList.add('on');hideCtx()}});
